server:
  port: 8080
spring:
  application:
    name: hm-service
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://${hm.db.host}:3306/hmall?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${hm.db.pw}
  redis:
    host: ${hm.redis.host:127.0.0.1}
    port: ${hm.redis.port:6379}
    database: ${hm.redis.database:0}
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 16
        min-idle: 4
        max-wait: 1000ms
  elasticsearch:
    uris: ${hm.es.uri:http://127.0.0.1:9200}
    connection-timeout: 5s
    socket-timeout: 10s
  rabbitmq:
    host: ${hm.mq.host:127.0.0.1}
    port: ${hm.mq.port:5672}
    username: ${hm.mq.username:guest}
    password: ${hm.mq.password:guest}
    virtual-host: /
    listener:
      simple:
        # 消费失败不重新入队，避免坏消息无限重投打满 CPU
        default-requeue-rejected: false
        prefetch: 10
        concurrency: 2
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
logging:
  level:
    com.hmall: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
knife4j:
  enable: true
  openapi:
    title: 黑马商城接口文档
    description: "黑马商城接口文档"
    email: zhanghuyi@itcast.cn
    concat: 虎哥
    url: https://www.itcast.cn
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.hmall.controller
hm:
  jwt:
    location: classpath:hmall.jks
    alias: hmall
    password: hmall123
    tokenTTL: 30m
  order:
    # 订单超时未支付自动取消的延迟时间，默认 15 分钟
    delay-ttl-ms: 900000
  sentinel:
    dashboard: 127.0.0.1:8858
    item-qps: 30
    order-qps: 10
  auth:
    excludePaths:
      - /search/**
      - /users/login
      - /items/**
      - /hi
# keytool -genkeypair -alias hmall -keyalg RSA -keypass hmall123 -keystore hmall.jks -storepass hmall123